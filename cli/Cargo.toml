[package]
name = "pact-plugin-cli"
version = "0.3.0"
edition = "2021"
authors = ["Ronald Holshausen <ronald.holshausen@smartbear.com>"]
description = "CLI utility for Pact plugins"
homepage = "http://www.pact.io"
repository = "https://github.com/pact-foundation/pact-plugins"
readme = "README.md"
keywords = ["pact"]
license = "MIT"
exclude = [
    "*.iml"
]

[dependencies]
pact-plugin-driver = "1.2.2"
clap = { version = "4.6.6", features = [ "derive", "cargo", "env" ] }
comfy-table = "8.0.0"
home = "0.5.12"
anyhow = "1.0.104"
serde_json = "1.0.151"
itertools = "0.15.0"
requestty = "0.6.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"]}
toml = "1.1.4"
url = "2.5.8"

[dev-dependencies]
trycmd = "1.2.1"
tempfile = "3.27.0"
expectest = "0.12.0"
test-log = "0.2.21"
env_logger = "0.11.11"

[profile.release]
strip = true
opt-level = "z" 
codegen-units = 1
lto = true

# References
# https://doc.rust-lang.org/stable/rustc/codegen-options/
# https://doc.rust-lang.org/rustc/profile-guided-optimization.html
# https://github.com/johnthagen/min-sized-rust
