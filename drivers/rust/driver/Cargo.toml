[package]
name = "pact-plugin-driver"
version = "1.1.1"
description = "Pact support library that provides an interface for interacting with Pact plugins"
edition = "2024"
documentation = "https://docs.rs/pact-plugin-driver"
homepage = "http://www.pact.io"
repository = "https://github.com/pact-foundation/pact-plugins"
readme = "README.md"
keywords = ["testing", "pact", "cdc"]
license = "MIT"
authors = ["Ronald Holshausen <uglyog@gmail.com>"]
exclude = [
    "*.iml"
]

[features]
default = ["datetime", "xml", "lua"]
datetime = ["pact_models/datetime"] # Support for date/time matchers and expressions
xml = ["pact_models/xml"] # support for matching XML documents
lua = ["dep:mlua", "dep:rsa", "dep:base64"] # support for plugins written in Lua

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
backtrace = "0.3.76"
base64 = { version = "0.23.0", optional = true }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"], default-features = false }
flate2 = "1.1.9"
futures-util = "0.3.33"
home = "0.5.12"
indicatif = "0.18.6"
itertools = "0.15.0"
lazy_static = "1.5.0"
lenient_semver = "0.4.2"
log = "0.4.33"
maplit = "1.0.2"
md5 = "0.8.1"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "send", "async"], optional = true }
os_info = "3.15.0"
pact_models = { version = "~1.3.13", default-features = false }
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "gzip", "deflate", "stream", "form"] }
rsa = { version = "0.9.10", features = ["sha2", "pem"], optional = true }
semver = "1.0.28"
serde_json = "1.0.151"
serde = { version = "1.0.229",  features = ["derive"] }
sha2 = "0.10.9"
sysinfo = "0.30.13"
tar = "0.4.46"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = { version = "0.1.44", features = [ "log" ] }
tracing-core = "0.1.36"
uuid = { version = "1.24.0", features = ["v4"] }
zip = "8.6.0"

[dev-dependencies]
env_logger = "0.11.11"
expectest = "0.12.0"
pretty_assertions = "1.4.1"
tempdir = "0.3.7"
test-log = "0.2.20"

[build-dependencies]
tonic-prost-build = "0.14.6"
