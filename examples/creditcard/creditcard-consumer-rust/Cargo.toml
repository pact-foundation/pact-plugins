[package]
name = "creditcard-consumer-rust"
version = "0.0.0"
edition = "2018"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
anyhow = "1.0.86"

[dev-dependencies]
expectest = "0.12.0"
pact_models = "~1.3.14"
pact_consumer = "~1.4.4"
pact-plugin-driver = { version = "~1.2.1", default-features = false, features = ["lua"] }
serde_json = "1.0.120"
test-log = "0.2.16"

[patch.crates-io]
pact-plugin-driver = { path = "../../../drivers/rust/driver" }
pact_models = { git = "https://github.com/pact-foundation/pact-reference.git" }
pact_consumer = { git = "https://github.com/pact-foundation/pact-reference.git" }
pact_matching = { git = "https://github.com/pact-foundation/pact-reference.git" }
pact_mock_server = { git = "https://github.com/pact-foundation/pact-core-mock-server.git" }
